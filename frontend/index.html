<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SIS AIR Ubaté</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-body">
    <!-- Efectos ambientales decorativos de fondo -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <!-- Botón de Alternancia Modo Oscuro / Modo Claro en Pantalla de Acceso -->
    <div class="login-theme-wrapper">
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Cambiar a Modo Oscuro / Modo Claro" aria-label="Cambiar tema">
            <span id="theme-toggle-icon">🌙</span>
        </button>
    </div>
    <!-- 
      ============================================
      SECCIÓN DE INICIO DE SESIÓN (LOGIN)
      ============================================
      Esta es la vista principal que carga por defecto.
      Contiene el formulario para ingresar correo y contraseña.
    -->
    <div class="login-container" id="login-section">
        <div class="logo-container">
            <img src="assets/logo_inicio.PNG" alt="SIS AIR Logo" class="login-logo" onerror="this.style.display='none'">
            <p>Sistema de Monitoreo del Aire en Ubaté</p>
        </div>

        <form id="login-form">
            <h2 style="text-align: center; margin-bottom: 1rem; color: var(--primary-blue);">Iniciar Sesión</h2>
            
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="Ingresa tu correo">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Ingresa tu contraseña">
            </div>
            
            <button type="submit" id="login-submit-btn" class="btn-primary">Iniciar Sesión</button>
            
            <p class="register-link">
                <span>¿No tienes cuenta?</span> <a href="#" id="show-register-btn">Regístrate aquí</a>
            </p>
            
            <p style="margin-top: 1.25rem; font-size: 0.8rem; border-top: 1px solid #eee; padding-top: 0.75rem;">
                <button type="button" class="terms-link-btn" id="open-privacy-login-btn">📜 Consultar Políticas de Privacidad</button>
            </p>
            
            <p id="login-error" class="error-msg" style="display: none;">Error al iniciar sesión.</p>
        </form>
    </div>

    <!-- 
      ============================================
      SECCIÓN DE REGISTRO DE USUARIOS
      ============================================
      Este contenedor está oculto por defecto (display: none).
      Se muestra únicamente cuando el usuario hace clic en "¿No tienes cuenta? Regístrate aquí".
    -->
    <div class="login-container" id="register-section" style="display: none;">
        <div class="logo-container">
            <img src="assets/logo_inicio.PNG" alt="SIS AIR Logo" class="login-logo" onerror="this.style.display='none'">
            <p>Sistema de Monitoreo del Aire en Ubaté</p>
        </div>

        <form id="register-form">
            <h2 style="text-align: center; margin-bottom: 1rem; color: var(--primary-blue);">Crear Cuenta</h2>
            
            <div class="form-group">
                <label for="reg-name">Nombre Completo</label>
                <input type="text" id="reg-name" required placeholder="Ingresa tu nombre">
            </div>
            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="Ingresa tu correo">
            </div>
            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required placeholder="Crea una contraseña">
            </div>

            <!-- Aceptación obligatoria de políticas de privacidad -->
            <div class="checkbox-group">
                <input type="checkbox" id="reg-privacy-check" required>
                <label for="reg-privacy-check">
                    He leído y acepto las <button type="button" class="terms-link-btn" id="open-privacy-reg-btn">Políticas de Privacidad y Tratamiento de Datos</button>
                </label>
            </div>
            
            <button type="submit" id="reg-submit-btn" class="btn-primary">Registrarse</button>
            
            <p class="register-link">
                <span>¿Ya tienes cuenta?</span> <a href="#" id="show-login-btn">Inicia sesión</a>
            </p>
            
            <p id="reg-error" class="error-msg" style="display: none;"></p>
            <p id="reg-success" style="display: none; color: green; font-size: 0.9rem; text-align: center; margin-top: 1rem;"></p>
        </form>
    </div>

    <!-- 
      ============================================
      MODAL DE POLÍTICAS DE PRIVACIDAD
      ============================================
      Permite consultar las políticas oficiales configuradas en el CMS
    -->
    <div id="privacy-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h3 id="privacy-modal-title">Políticas de Privacidad y Protección de Datos</h3>
                <button id="close-privacy-modal" class="btn-close">&times;</button>
            </div>
            <div class="modal-body" id="privacy-modal-body">
                <!-- Se inyecta dinámicamente desde CMSManager -->
            </div>
        </div>
    </div>

    <!-- Carga del archivo principal de JavaScript donde reside toda la lógica de autenticación -->
    <script src="app_v2.js"></script>
</body>

</html>
