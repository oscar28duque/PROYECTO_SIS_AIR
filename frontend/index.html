<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SIS AIR Ubaté</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-body">
    <div class="login-container" id="login-section">
        <div class="logo-container">
            <img src="assets/logo_inicio.PNG" alt="SIS AIR Logo" class="login-logo" onerror="this.style.display='none'">
            <p>Sistema de Monitoreo del Aire en Ubaté</p>
        </div>

        <form id="login-form">
            <h2 style="text-align: center; margin-bottom: 1rem; color: var(--primary-blue);">Iniciar Sesión</h2>
            
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="Ingresa tu correo">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Ingresa tu contraseña">
            </div>
            
            <button type="submit" id="login-submit-btn" class="btn-primary">Iniciar Sesión</button>
            
            <p class="register-link">
                <span>¿No tienes cuenta?</span> <a href="#" id="show-register-btn">Regístrate aquí</a>
            </p>
            
            <p id="login-error" class="error-msg" style="display: none;">Error al iniciar sesión.</p>
        </form>
    </div>

    <div class="login-container" id="register-section" style="display: none;">
        <div class="logo-container">
            <img src="assets/logo_inicio.PNG" alt="SIS AIR Logo" class="login-logo" onerror="this.style.display='none'">
            <p>Sistema de Monitoreo del Aire en Ubaté</p>
        </div>

        <form id="register-form">
            <h2 style="text-align: center; margin-bottom: 1rem; color: var(--primary-blue);">Crear Cuenta</h2>
            
            <div class="form-group">
                <label for="reg-name">Nombre Completo</label>
                <input type="text" id="reg-name" required placeholder="Ingresa tu nombre">
            </div>
            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="Ingresa tu correo">
            </div>
            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required placeholder="Crea una contraseña">
            </div>
            
            <button type="submit" id="reg-submit-btn" class="btn-primary">Registrarse</button>
            
            <p class="register-link">
                <span>¿Ya tienes cuenta?</span> <a href="#" id="show-login-btn">Inicia sesión</a>
            </p>
            
            <p id="reg-error" class="error-msg" style="display: none;"></p>
            <p id="reg-success" style="display: none; color: green; font-size: 0.9rem; text-align: center; margin-top: 1rem;"></p>
        </form>
    </div>
    <script src="app_v2.js"></script>
</body>

</html>
