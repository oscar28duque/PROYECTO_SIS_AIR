<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SIS AIR Ubaté</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="logo-container">
            <!-- La imagen debe estar en la carpeta assets -->
            <img src="assets/logo.png" alt="SIS AIR Logo" class="login-logo" onerror="this.style.display='none'">
            <h1>SIS AIR</h1>
            <p>Calidad del Aire en Ubaté</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="Ingresa tu usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Ingresa tu contraseña">
            </div>
            <button type="submit" class="btn-primary">Iniciar Sesión</button>
            <p class="register-link">¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
            <p id="login-error" class="error-msg" style="display: none;">Usuario o contraseña incorrectos.</p>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
